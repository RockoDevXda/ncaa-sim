name: Nightly NCAA D1 Simulation

on:
  schedule:
    - cron: '15 6 * * *'
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-sim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run NCAA Monte Carlo Simulation (ESPN + Line Tracking)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DASHBOARD_URL: "https://rockodevxda.github.io/sports-command-center/"
        run: python daily_runner.py

      - name: Commit updated slate JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_slate.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily NCAA slate & line movement" && git pull --rebase && git push)
