def normalize_team(name: str) -> str:
    s = name.lower().strip()
    s = re.sub(r"\([^)]*\)", "", s)
    s = re.sub(r"[^\w\s]", "", s)
    s = re.sub(r"\bstate\b", "st", s)
    s = re.sub(r"\s+", " ", s).strip()
    return TEAM_ALIASES.get(s, s)


def fetch_apisports_ncaa_odds():
    """Uses 2 API-Sports requests (League 116 = NCAA) to pull bookmaker spreads & totals."""
    if not API_SPORTS_KEY:
        return {}

    date_iso = datetime.now().strftime("%Y-%m-%d")
    season_year = datetime.now().year if datetime.now().month >= 7 else datetime.now().year - 1
    season_str = f"{season_year}-{season_year + 1}"
    api_headers = {"x-apisports-key": API_SPORTS_KEY}
    odds_map = {}

    try:
        # Request 1: Get today's NCAA games
        g_resp = requests.get(
            "https://v1.basketball.api-sports.io/games",
            headers=api_headers,
            params={"league": 116, "season": season_str, "date": date_iso},
            timeout=15,
        )
        if g_resp.status_code != 200:
            return {}

        game_teams = {}
        for item in g_resp.json().get("response", []):
            gid = item.get("id")
            home_name = item.get("teams", {}).get("home", {}).get("name", "")
            away_name = item.get("teams", {}).get("away", {}).get("name", "")
            if gid and home_name and away_name:
                game_teams[gid] = (normalize_team(away_name), normalize_team(home_name))

        if not game_teams:
            return {}

        # Request 2: Batch-fetch odds for NCAA league on today's date
        o_resp = requests.get(
            "https://v1.basketball.api-sports.io/odds",
            headers=api_headers,
            params={"league": 116, "season": season_str, "date": date_iso},
            timeout=15,
        )
        if o_resp.status_code != 200:
            return {}

        for entry in o_resp.json().get("response", []):
            gid = entry.get("game", {}).get("id")
            if gid not in game_teams:
                continue
            away_norm, home_norm = game_teams[gid]

            spread_val = None
            total_val = None
            for book in entry.get("bookmakers", []):
                for bet in book.get("bets", []):
                    bname = bet.get("name", "").lower()
                    if "asian handicap" in bname or "spread" in bname:
                        for v in bet.get("values", []):
                            val_str = str(v.get("value", ""))
                            if val_str.startswith("Home"):
                                m = re.search(r"([+-]?\d+\.?\d*)", val_str)
                                if m:
                                    spread_val = float(m.group(1))
                                    break
                    elif "over/under" in bname:
                        for v in bet.get("values", []):
                            val_str = str(v.get("value", ""))
                            if val_str.startswith("Over"):
                                m = re.search(r"(\d+\.?\d*)", val_str)
                                if m:
                                    total_val = float(m.group(1))
                                    break
                if spread_val is not None:
                    break

            if spread_val is not None or total_val is not None:
                odds_map[(away_norm, home_norm)] = {
                    "home_spread": spread_val,
                    "total": total_val,
                }

        print(f"API-Sports NCAA: enriched {len(odds_map)} matchups (2 requests used).")
        return odds_map
    except Exception as e:
        print(f"API-Sports NCAA note ({e}); using ESPN odds.")
        return {}


def fetch_haslametrics_ratings():
    """Fetches tempo-free schedule-adjusted efficiency & pace from Haslametrics."""
    season_yr = str(datetime.now().year + 1 if datetime.now().month >= 7 else datetime.now().year)[-2:]
    xml_url = f"https://haslametrics.com/ratings{season_yr}.xml"
    ratings = {}

    try:
        resp = requests.get(xml_url, headers=HEADERS, timeout=15)
        if resp.status_code == 200 and "<" in resp.text:
            root = ET.fromstring(resp.text)
            for mr in root.findall(".//mr"):
                team_raw = mr.attrib.get("t", "").strip()
                if not team_raw:
                    continue
                norm = normalize_team(team_raw)
                try:
                    ratings[norm] = {
                        "adj_o": round(float(mr.attrib.get("ou", 105.0)), 1),
                        "adj_d": round(float(mr.attrib.get("du", 105.0)), 1),
                        "tempo": round(float(mr.attrib.get("p", 68.0)), 1),
                        "source": "Haslametrics",
                    }
                except (ValueError, TypeError):
                    continue
            if len(ratings) > 100:
                print(f"Loaded {len(ratings)} teams from Haslametrics XML.")
                return ratings
    except Exception:
        pass

    try:
        resp = requests.get("https://haslametrics.com/ratings.php", headers=HEADERS, timeout=15)
        if resp.status_code == 200:
            tables = pd.read_html(io.StringIO(resp.text))
            for df in tables:
                if len(df) < 100:
                    continue
                if isinstance(df.columns, pd.MultiIndex):
                    df.columns = [str(col[-1]) for col in df.columns]
                cols = [str(c) for c in df.columns]
                team_col = next((c for c in cols if "Team" in c), None)
                off_col = next((c for c in cols if c in ("Eff", "O_Eff", "Off")), None)
                def_col = next((c for c in cols if c in ("Eff.1", "D_Eff", "Def")), None)
                pace_col = next((c for c in cols if "Pace" in c or "Tempo" in c), None)
                if team_col and off_col and def_col:
                    for _, row in df.iterrows():
                        t_raw = re.sub(r"\s+\(\d+-\d+\)$", "", str(row[team_col])).strip()
                        norm = normalize_team(t_raw)
                        try:
                            ratings[norm] = {
                                "adj_o": round(float(row[off_col]), 1),
                                "adj_d": round(float(row[def_col]), 1),
                                "tempo": round(float(row[pace_col]), 1) if pace_col else 68.0,
                                "source": "Haslametrics",
                            }
                        except (ValueError, TypeError):
                            continue
                    if len(ratings) > 100:
                        print(f"Loaded {len(ratings)} teams from Haslametrics HTML.")
                        return ratings
    except Exception:
        pass

    return {}


def fetch_todays_games(apisports_odds):
    today_str = datetime.now().strftime("%Y%m%d")
    url = (
        f"https://site.api.espn.com/apis/site/v2/sports/basketball/"
        f"mens-college-basketball/scoreboard?dates={today_str}&groups=50&limit=200"
    )
    resp = requests.get(url, headers=HEADERS, timeout=15)
    resp.raise_for_status()
    data = resp.json()

    games = []
    for event in data.get("events", []):
        comp = event["competitions"][0]
        competitors = comp["competitors"]
        home = next(c for c in competitors if c["homeAway"] == "home")
        away = next(c for c in competitors if c["homeAway"] == "away")

        away_short = away["team"].get("shortDisplayName", away["team"]["displayName"])
        home_short = home["team"].get("shortDisplayName", home["team"]["displayName"])
        away_loc = away["team"].get("location", away_short)
        home_loc = home["team"].get("location", home_short)

        odds_info = comp.get("odds", [{}])[0] if comp.get("odds") else {}
        spread_details = odds_info.get("details", "PK")
        home_spread = float(odds_info.get("spread", 0.0) or 0.0)
        game_ou = float(odds_info.get("overUnder", 0.0) or 0.0)
        has_line = bool(odds_info.get("details"))

        # Check API-Sports odds enrichment if ESPN lacks a line or to fill missing totals
        api_entry = apisports_odds.get((normalize_team(away_loc), normalize_team(home_loc)))
        if api_entry:
            if not has_line and api_entry.get("home_spread") is not None:
                home_spread = api_entry["home_spread"]
                has_line = True
                fav = home_short if home_spread < 0 else away_short
                spread_details = f"{fav} {-abs(home_spread):g}"
            if game_ou == 0.0 and api_entry.get("total"):
                game_ou = api_entry["total"]

        tip_dt = datetime.fromisoformat(event["date"].replace("Z", "+00:00"))
        tip_str = tip_dt.strftime("%I:%M %p UTC")

        games.append({
            "id": event["id"],
            "tipoff": tip_str,
            "venue": comp.get("venue", {}).get("fullName", "TBD"),
            "neutral": comp.get("neutralSite", False),
            "market_line": spread_details,
            "home_spread": home_spread,
            "over_under": game_ou,
            "has_line": has_line,
            "away_id": away["team"]["id"],
            "away_team": away["team"]["displayName"],
            "away_short": away_short,
            "away_location": away_loc,
            "away_record": away.get("records", [{}])[0].get("summary", "0-0"),
            "home_id": home["team"]["id"],
            "home_team": home["team"]["displayName"],
            "home_short": home_short,
            "home_location": home_loc,
            "home_record": home.get("records", [{}])[0].get("summary", "0-0"),
        })
    return games


def fetch_espn_fallback(team_id, record_str):
    if team_id in espn_stats_cache:
        return espn_stats_cache[team_id]

    url = f"https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/teams/{team_id}/statistics"
    try:
        resp = requests.get(url, headers=HEADERS, timeout=10)
        if resp.status_code == 200:
            categories = resp.json().get("results", {}).get("stats", {}).get("categories", [])
            ppg, fga, fta, orb, tov = None, 58.0, 18.0, 10.0, 12.0
            for cat in categories:
                for stat in cat.get("stats", []):
                    n, v = stat.get("name", ""), float(stat.get("value", 0) or 0)
                    if n == "avgPoints":
                        ppg = v
                    elif n == "avgFieldGoalsAttempted":
                        fga = v
                    elif n == "avgFreeThrowsAttempted":
                        fta = v
                    elif n == "avgOffensiveRebounds":
                        orb = v
                    elif n == "avgTurnovers":
                        tov = v
            if ppg and ppg > 40:
                poss = max(60.0, min(78.0, fga - orb + tov + (0.44 * fta)))
                adj_o = round((ppg / poss) * 100.0, 1)
                parts = record_str.split("-")
                win_pct = int(parts[0]) / max(1, int(parts[0]) + int(parts[1])) if len(parts) == 2 else 0.5
                adj_d = round(107.0 - (win_pct * 8.5), 1)
                res = {"adj_o": adj_o, "adj_d": adj_d, "tempo": round(poss, 1), "source": "ESPN"}
                espn_stats_cache[team_id] = res
                return res
    except Exception:
        pass

    res = {"adj_o": 95.0, "adj_d": 112.0, "tempo": 67.5, "source": "Fallback"}
    espn_stats_cache[team_id] = res
    return res


def get_team_efficiency(game, side, hasla_ratings):
    if hasla_ratings:
        candidates = [
            game[f"{side}_location"],
            game[f"{side}_short"],
            game[f"{side}_team"],
        ]
        keys = list(hasla_ratings.keys())

        for c in candidates:
            norm = normalize_team(c)
            if norm in hasla_ratings:
                return hasla_ratings[norm], True

        for c in candidates:
            norm = normalize_team(c)
            matches = difflib.get_close_matches(norm, keys, n=1, cutoff=0.84)
            if matches:
                return hasla_ratings[matches[0]], True

    fb = fetch_espn_fallback(game[f"{side}_id"], game[f"{side}_record"])
    return fb, (fb["source"] == "ESPN")


def run_monte_carlo(game, hasla_ratings, n_sims=10000):
    away_stats, away_ok = get_team_efficiency(game, "away", hasla_ratings)
    home_stats, home_ok = get_team_efficiency(game, "home", hasla_ratings)

    hca = 0.0 if game["neutral"] else 3.3
    exp_tempo = (away_stats["tempo"] + home_stats["tempo"]) / 2.0

    league_avg = 105.5
    away_exp_eff = league_avg + (away_stats["adj_o"] - league_avg) + (home_stats["adj_d"] - league_avg)
    home_exp_eff = league_avg + (home_stats["adj_o"] - league_avg) + (away_stats["adj_d"] - league_avg) + hca

    away_wins = 0
    home_covers = 0
    away_covers = 0
    away_pts_total = 0.0
    home_pts_total = 0.0
    home_spread = game["home_spread"]

    for _ in range(n_sims):
        poss = random.gauss(exp_tempo, 2.7)
        a_pts = (random.gauss(away_exp_eff, 10.2) / 100.0) * poss
        h_pts = (random.gauss(home_exp_eff, 10.2) / 100.0) * poss
        away_pts_total += a_pts
        home_pts_total += h_pts

        if a_pts > h_pts:
            away_wins += 1

        if (h_pts + home_spread) > a_pts:
            home_covers += 1
        elif (h_pts + home_spread) < a_pts:
            away_covers += 1

    away_proj = round(away_pts_total / n_sims, 1)
    home_proj = round(home_pts_total / n_sims, 1)
    away_prob = round((away_wins / n_sims) * 100, 1)
    home_prob = round(100.0 - away_prob, 1)

    favored_team = game["away_short"] if away_prob >= home_prob else game["home_short"]
    favored_prob = max(away_prob, home_prob)

    home_cover_pct = round((home_covers / n_sims) * 100, 1)
    away_cover_pct = round((away_covers / n_sims) * 100, 1)

    sim_home_margin = home_proj - away_proj
    vegas_home_margin = -home_spread
    edge_pts = round(abs(sim_home_margin - vegas_home_margin), 1)

    if home_cover_pct >= away_cover_pct:
        spread_pick = f"{game['home_short']} {home_spread:+g}" if home_spread != 0 else f"{game['home_short']} PK"
        spread_cover_pct = home_cover_pct
    else:
        away_spread = -home_spread
        spread_pick = f"{game['away_short']} {away_spread:+g}" if away_spread != 0 else f"{game['away_short']} PK"
        spread_cover_pct = away_cover_pct

    verified_d1 = away_ok and home_ok and abs(home_spread) <= 24.5 and edge_pts <= 13.0
    rating_source = "Haslametrics" if (away_stats["source"] == "Haslametrics" and home_stats["source"] == "Haslametrics") else "ESPN"

    return {
        **game,
        "rating_source": rating_source,
        "verified_d1": verified_d1,
        "away_proj": away_proj,
        "home_proj": home_proj,
        "away_win_pct": away_prob,
        "home_win_pct": home_prob,
        "favored_team": favored_team,
        "favored_prob": favored_prob,
        "spread_pick": spread_pick,
        "spread_cover_pct": spread_cover_pct,
        "edge_pts": edge_pts,
        "generated_at": datetime.now().strftime("%Y-%m-%d %I:%M %p"),
    }


def prob_to_american_odds(prob_pct):
    p = prob_pct / 100.0
    if p <= 0 or p >= 1:
        return "N/A"
    if p >= 0.5:
        return f"{int(round(-100 * p / (1 - p)))}"
    return f"+{int(round(100 * (1 - p) / p))}"


def send_discord_report(results):
    if not DISCORD_WEBHOOK_URL:
        return

    date_label = datetime.now().strftime("%b %d, %Y")
    if not results:
        requests.post(
            DISCORD_WEBHOOK_URL,
            json={"username": "NCAA Monte Carlo Engine", "content": f"🏀 **{date_label}:** No NCAA D1 games scheduled today."},
            timeout=15,
        )
        return

    pool = [g for g in results if g["verified_d1"]] or results
    lined_pool = [g for g in pool if g["has_line"]]

    top_spreads = sorted(lined_pool, key=lambda x: x["spread_cover_pct"], reverse=True)
    top_ml = sorted(pool, key=lambda x: x["favored_prob"], reverse=True)

    parlay_legs = []
    used_ids = set()

    for g in top_spreads[:2]:
        parlay_legs.append({
            "game": f"{g['away_short']} @ {g['home_short']}",
            "pick": g["spread_pick"],
            "prob": g["spread_cover_pct"],
            "note": f"+{g['edge_pts']} pt edge vs `{g['market_line']}` (Sim: {g['away_proj']}-{g['home_proj']})",
        })
        used_ids.add(g["id"])

    for g in top_ml:
        if len(parlay_legs) >= 4:
            break
        if g["id"] not in used_ids:
            parlay_legs.append({
                "game": f"{g['away_short']} @ {g['home_short']}",
                "pick": f"{g['favored_team']} ML",
                "prob": g["favored_prob"],
                "note": f"Sim: {g['away_proj']} - {g['home_proj']} • Line: `{g['market_line']}`",
            })
            used_ids.add(g["id"])

    parlay_prob = 1.0
    for leg in parlay_legs:
        parlay_prob *= (leg["prob"] / 100.0)
    parlay_pct = round(parlay_prob * 100, 1) if parlay_legs else 0.0

    parlay_fields = [
        {
            "name": f"Leg {i+1}: {leg['pick']} ({leg['prob']}% | Fair {prob_to_american_odds(leg['prob'])})",
            "value": f"**{leg['game']}** • {leg['note']}",
            "inline": False,
        }
        for i, leg in enumerate(parlay_legs)
    ]

    embed_parlay = {
        "title": f"🎯 Top 4-Team NCAA Edge Parlay — {date_label}",
        "url": DASHBOARD_URL,
        "description": (
            f"**Combined Hit Rate:** `{parlay_pct}%` (**Fair Odds: {prob_to_american_odds(parlay_pct)}**)\n"
            f"10,000-run simulation vs. live bookmaker lines. [Open Command Center]({DASHBOARD_URL})"
        ),
        "color": 3066993,
        "fields": parlay_fields,
        "footer": {"text": "SimLab NCAA Engine • Haslametrics + API-Sports + ESPN"},
        "timestamp": datetime.utcnow().isoformat() + "Z",
    }

    slate_lines = [
        f"• **{g['away_short']}** `{g['away_proj']}` ({g['away_win_pct']}%) @ **{g['home_short']}** `{g['home_proj']}` ({g['home_win_pct']}%) `[{g['market_line']}]`"
        for g in results[:35]
    ]
    embed_slate = {
        "title": f"📋 Full Slate Projections ({len(results)} Games)",
        "description": "\n".join(slate_lines)[:3900],
        "color": 3447003,
    }

    payload = {"username": "NCAA Monte Carlo Engine", "embeds": [embed_parlay, embed_slate]}
    with open("daily_slate.json", "rb") as json_file:
        files = {
            "payload_json": (None, json.dumps(payload), "application/json"),
            "files[0]": ("daily_slate.json", json_file, "application/json"),
        }
        resp = requests.post(DISCORD_WEBHOOK_URL, files=files, timeout=20)
        if resp.status_code == 429:
            time.sleep(float(resp.json().get("retry_after", 2)))
            json_file.seek(0)
            requests.post(DISCORD_WEBHOOK_URL, files=files, timeout=20)
        else:
            resp.raise_for_status()


if __name__ == "__main__":
    apisports_odds = fetch_apisports_ncaa_odds()
    hasla_ratings = fetch_haslametrics_ratings()
    games = fetch_todays_games(apisports_odds)
    results = [run_monte_carlo(g, hasla_ratings, n_sims=10000) for g in games]

    with open("daily_slate.json", "w") as f:
        json.dump(results, f, indent=2)

    send_discord_report(results)
    print(f"Completed {len(results)} NCAA simulations.")
