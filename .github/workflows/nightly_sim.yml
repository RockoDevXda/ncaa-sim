name: Nightly NCAA Monte Carlo Sim

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run daily simulation and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python daily_runner.py

      - name: Commit and push updated daily_slate.json
        run: |
          git config user.name "SimBot"
          git config user.email "bot@users.noreply.github.com"
          git add daily_slate.json
          git commit -m "Auto-update slate for $(date +'%Y-%m-%d')" || exit 0
          git pull --rebase origin main
          git push
