name: Nightly NCAA D1 Simulation

on:
  schedule:
    - cron: '15 6 * * *' # Runs daily at 12:15 AM CST (6:15 AM UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-sim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pandas cloudscraper kenpompy

      - name: Run Monte Carlo Simulation (KenPom + ESPN)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KENPOM_EMAIL: ${{ secrets.KENPOM_EMAIL }}
          KENPOM_PASSWORD: ${{ secrets.KENPOM_PASSWORD }}
          DASHBOARD_URL: "https://rockodevxda.github.io/sports-command-center/"
        run: python daily_runner.py

      - name: Commit updated slate JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_slate.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily NCAA slate (KenPom)" && git push)
